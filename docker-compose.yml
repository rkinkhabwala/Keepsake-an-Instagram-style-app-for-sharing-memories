services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keepsake}
      POSTGRES_USER: ${POSTGRES_USER:-keepsake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keepsake-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keepsake} -d ${POSTGRES_DB:-keepsake}"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    # Upstream MinIO no longer publishes free images; this is a community rebuild of the upstream release.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-keepsake}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-keepsake-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Single-node Kafka in KRaft mode (no ZooKeeper), reachable only inside the Compose network.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 20

  backend:
    build:
      context: ./backend
    environment: &backend-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keepsake}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-keepsake}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-keepsake-local}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEEPSAKE_WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      KEEPSAKE_TRUSTED_PROXIES: web
      KEEPSAKE_JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-secret-of-at-least-32-characters}
      KEEPSAKE_S3_ENDPOINT: http://minio:9000
      KEEPSAKE_S3_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      KEEPSAKE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-keepsake}
      KEEPSAKE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-keepsake-local-secret}
      KEEPSAKE_S3_BUCKET: ${MINIO_BUCKET:-keepsake}
      # Demo accounts share a published password, so seeding is opt-in: SEED_DEMO=true.
      KEEPSAKE_SEED_ENABLED: ${SEED_DEMO:-false}
    ports:
      # Reachable from this machine for development, not from the network; browsers go through web.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      # Local only: reachable from this machine, not from the network.
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

  # Metrics and dashboards (spec §11): docker compose --profile observability up
  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:13.0.10
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-keepsake-local-grafana}
      # Local, read-only viewing without a login; changes still need the admin account.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/keepsake.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  # Load test (Phase 3): docker compose --profile loadtest run --rm k6. See README.
  loadtest-seed:
    profiles: ["loadtest"]
    build:
      context: ./backend
      args:
        MAVEN_PROFILES: loadtest
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: loadtest
      # The command exits when done; its own HTTP server listens on a random port nothing reaches.
      SERVER_PORT: "0"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      KEEPSAKE_SEED_ENABLED: "false"
      KEEPSAKE_LOADTEST_TOKENS_FILE: /loadtest/tokens.json
    volumes:
      - loadtest-data:/loadtest
    depends_on:
      backend:
        condition: service_healthy

  k6:
    profiles: ["loadtest"]
    image: grafana/k6:2.3.0
    command: ["run", "/scripts/feed.js"]
    environment:
      BASE_URL: http://backend:8080
    volumes:
      - ./loadtest:/scripts:ro
      - loadtest-data:/loadtest:ro
    depends_on:
      loadtest-seed:
        condition: service_completed_successfully

volumes:
  loadtest-data:
  postgres-data:
  minio-data:
  kafka-data:
  prometheus-data:
  grafana-data:
