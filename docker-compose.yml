services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keepsake}
      POSTGRES_USER: ${POSTGRES_USER:-keepsake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keepsake-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keepsake} -d ${POSTGRES_DB:-keepsake}"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    # Upstream MinIO no longer publishes free images; this is a community rebuild of the upstream release.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-keepsake}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-keepsake-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keepsake}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-keepsake}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-keepsake-local}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KEEPSAKE_WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      KEEPSAKE_TRUSTED_PROXIES: web
      KEEPSAKE_JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-secret-of-at-least-32-characters}
      KEEPSAKE_S3_ENDPOINT: http://minio:9000
      KEEPSAKE_S3_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      KEEPSAKE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-keepsake}
      KEEPSAKE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-keepsake-local-secret}
      KEEPSAKE_S3_BUCKET: ${MINIO_BUCKET:-keepsake}
      # Demo accounts share a published password, so seeding is opt-in: SEED_DEMO=true.
      KEEPSAKE_SEED_ENABLED: ${SEED_DEMO:-false}
    ports:
      # Reachable from this machine for development, not from the network; browsers go through web.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      # Local only: reachable from this machine, not from the network.
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
