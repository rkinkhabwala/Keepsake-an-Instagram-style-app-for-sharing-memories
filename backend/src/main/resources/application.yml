spring:
  application:
    name: keepsake
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/keepsake}
    username: ${SPRING_DATASOURCE_USERNAME:keepsake}
    password: ${SPRING_DATASOURCE_PASSWORD:keepsake-local}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
server:
  port: ${SERVER_PORT:8080}
  # Tomcat's own handling would trust X-Forwarded-For from any private address; TrustedProxyFilter trusts it only
  # from keepsake.trusted-proxies instead.
  forward-headers-strategy: none
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: logstash
keepsake:
  web-origin: ${KEEPSAKE_WEB_ORIGIN:http://localhost:5173}
  # Host names or IPs whose X-Forwarded-For is believed (comma-separated); in Compose, the web container.
  trusted-proxies: ${KEEPSAKE_TRUSTED_PROXIES:}
  jwt-secret: ${KEEPSAKE_JWT_SECRET:local-development-secret-change-before-deploy-123456}
  auth:
    cookie-secure: ${KEEPSAKE_AUTH_COOKIE_SECURE:false}
  s3:
    endpoint: ${KEEPSAKE_S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${KEEPSAKE_S3_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${KEEPSAKE_S3_ACCESS_KEY:keepsake}
    secret-key: ${KEEPSAKE_S3_SECRET_KEY:keepsake-local-secret}
    bucket: ${KEEPSAKE_S3_BUCKET:keepsake}
    region: ${KEEPSAKE_S3_REGION:us-east-1}
  media:
    heif-decoder: ${KEEPSAKE_HEIF_DECODER:heif-dec}
    heif-info: ${KEEPSAKE_HEIF_INFO:heif-info}
    processing-timeout: ${KEEPSAKE_PROCESSING_TIMEOUT:PT10M}
  seed:
    enabled: ${KEEPSAKE_SEED_ENABLED:false}
